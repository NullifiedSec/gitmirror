# gitmirror configuration
# TOML is the preferred format. JSON remains supported for compatibility.

listen = ":8080"
data_dir = ".gitmirror"

[[pairs]]
name = "github-gitea-example"

[pairs.left]
provider = "github"
full_name = "upstream-owner/private-repo"
url = "git@github.com:upstream-owner/private-repo.git"
# Polling is optional and configured independently on each side.
# polling = true
# polling_frequency = 120

[pairs.right]
provider = "gitea"
full_name = "mirror-owner/private-repo"
url = "git@git.example.com:mirror-owner/private-repo.git"
# Updates to listed branches are never pushed automatically. GitMirror writes a
# durable approval request and logs its ID. Approval re-validates the exact
# source and target SHAs before pushing:
#   gitmirror -config /etc/gitmirror/gitmirror.toml -approve <approval-id>
# human_in_loop_branches = ["main"]
