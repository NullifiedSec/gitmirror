name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false
      - name: Format check
        run: |
          gofmt -d .
          test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Validate deployment scripts
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh
          bash scripts/install.sh --help >/dev/null
          bash scripts/uninstall.sh --help >/dev/null
      - name: Verify systemd unit
        run: |
          go build -trimpath -o /tmp/gitmirror-ci ./cmd/gitmirror
          sudo install -o root -g root -m 0755 /tmp/gitmirror-ci /usr/local/bin/gitmirror
          sudo useradd --system --home-dir /var/lib/gitmirror --shell /usr/sbin/nologin gitmirror
          sudo install -d -o root -g gitmirror -m 0750 /etc/gitmirror
          sudo install -d -o gitmirror -g gitmirror -m 0700 /var/lib/gitmirror
          sudo touch /etc/gitmirror/gitmirror.toml
          sudo systemd-analyze verify deploy/systemd/gitmirror.service
